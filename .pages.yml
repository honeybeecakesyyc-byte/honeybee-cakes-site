  - name: website_design
    label: "Colours + fonts — VERIFIED V5"
    type: file
    path: content/design.json
    format: json
    operations: { delete: false }
    fields:
      - name: heading_font
        label: "FONT — Headings"
        type: select
        options: { values: [Bodoni Moda, Cormorant Garamond, DM Serif Display, Playfair Display, Libre Baskerville, EB Garamond, Lora] }
      - name: body_font
        label: "FONT — Body text"
        type: select
        options: { values: [Cormorant Garamond, EB Garamond, Lora, Libre Baskerville, Playfair Display, DM Sans, Montserrat] }
      - name: ui_font
        label: "FONT — Small labels/buttons"
        type: select
        options: { values: [DM Sans, Montserrat, Cormorant Garamond, EB Garamond] }
      - { name: color_heading, label: "COLOUR — Headings", type: string, description: "Hex e.g. #4A403C" }
      - { name: color_body, label: "COLOUR — Body text", type: string }
      - { name: color_muted, label: "COLOUR — Secondary text", type: string }
      - { name: color_accent, label: "COLOUR — Accent", type: string }
      - { name: color_line, label: "COLOUR — Divider lines", type: string }
      - { name: order_text_color, label: "COLOUR — Order text (blank = automatic)", type: string }
      - { name: bg_navigation, label: "BACKGROUND — Navigation", type: string }
      - { name: bg_hero, label: "BACKGROUND — Home text side", type: string }
      - { name: bg_intro, label: "BACKGROUND — Intro", type: string }
      - { name: bg_gallery, label: "BACKGROUND — Gallery", type: string }
      - { name: bg_flavours, label: "BACKGROUND — Flavours", type: string }
      - { name: bg_pricing, label: "BACKGROUND — Price + size", type: string }
      - { name: bg_faq, label: "BACKGROUND — FAQ", type: string }
      - { name: bg_order, label: "BACKGROUND — Order", type: string }
      - { name: bg_policies, label: "BACKGROUND — Policies", type: string }
      - { name: bg_contact, label: "BACKGROUND — Contact + reviews", type: string }
      - { name: bg_footer, label: "BACKGROUND — Footer", type: string }

  - name: website_images
    label: "Website images — VERIFIED V5"
    type: file
    path: content/images.json
    format: json
    operations: { delete: false }
    fields:
      - { name: logo, label: "HOME — Logo image", type: image, options: { media: site_images } }
      - { name: logo_alt, label: "HOME — Logo description", type: string }
      - { name: hero_image, label: "HOME — Landing image", type: image, options: { media: site_images } }
      - { name: hero_image_alt, label: "HOME — Landing image description", type: string }

  - name: gallery
    label: Gallery
    type: file
    path: content/gallery.json
    format: json
    list: true
    fields:
      - { name: title, label: Cake title, type: string, required: true }
      - name: category
        label: Category
        type: select
        options: { values: [Vintage, Floral, Minimal, Kids, Wedding, Cupcakes, Bento Box, Other] }
      - { name: image, label: Photo, type: image, options: { media: site_images }, required: true }
      - { name: alt, label: Image description, type: string }

  - name: flavours
    label: Flavour builder
    type: file
    path: content/flavours.json
    format: json
    operations:
      delete: false
    fields:
      - name: sponges
        label: "1. Sponge"
        type: object
        fields:
          - { name: number, label: Number, type: string }
          - { name: title, label: Heading, type: string }
          - { name: optional_label, label: Optional label, type: string }
          - name: items
            label: Sponge options
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string, required: true }
              - { name: note, label: Optional note, type: string }
      - name: frostings
        label: "2. Frosting"
        type: object
        fields:
          - { name: number, label: Number, type: string }
          - { name: title, label: Heading, type: string }
          - { name: optional_label, label: Optional label, type: string }
          - name: items
            label: Frosting options
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string, required: true }
              - { name: note, label: Optional note, type: string }
      - name: fillings
        label: "3. Filling"
        type: object
        fields:
          - { name: number, label: Number, type: string }
          - { name: title, label: Heading, type: string }
          - { name: optional_label, label: Optional label, type: string }
          - name: items
            label: Filling options
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string, required: true }
              - { name: note, label: Optional note, type: string }
      - name: add_ins
        label: "4. Add-in"
        type: object
        fields:
          - { name: number, label: Number, type: string }
          - { name: title, label: Heading, type: string }
          - { name: optional_label, label: Optional label, type: string }
          - name: items
            label: Add-in options
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string, required: true }
              - { name: note, label: Optional note, type: string }

  - name: pricing
    label: Price + size guide
    type: file
    path: content/pricing.json
    format: json
    list: true
    fields:
      - { name: size, label: Size label, type: string }
      - { name: diameter, label: Diameter in inches, type: number }
      - { name: servings, label: Approximate servings, type: string }
      - { name: price, label: Starting price, type: string }
      - { name: image, label: "Custom size illustration (optional — replaces cylinder)", type: image, options: { media: site_images } }
      - { name: image_alt, label: Illustration description, type: string }

  - name: faq
    label: FAQ questions
    type: file
    path: content/faq.json
    format: json
    list: true
    fields:
      - { name: question, label: Question, type: string, required: true }
      - { name: answer, label: Answer, type: text, required: true }

  - name: policies
    label: Policies
    type: file
    path: content/policies.json
    format: json
    operations: { delete: false }
    fields:
      - { name: title, label: Heading, type: string }
      - { name: intro, label: Intro, type: text }
      - { name: body, label: Full policies, type: text, description: "Long text is fine. Blank line = new paragraph." }

  - name: reviews
    label: Google reviews
    type: file
    path: content/reviews.json
    format: json
    operations: { delete: false }
    fields:
      - { name: google_url, label: Google Business / reviews link, type: string }
      - { name: rating, label: Overall rating, type: string }
      - { name: review_count, label: Review count text, type: string }
      - name: items
        label: Reviews shown on website
        type: object
        list: true
        fields:
          - { name: author, label: Customer name, type: string }
          - { name: stars, label: Stars, type: number }
          - { name: date, label: Date / relative date, type: string }
          - { name: text, label: Review text, type: text }
