  - name: website_images
    label: Website images
    type: file
    path: content/images.json
    format: json
    operations: { delete: false }
    fields:
      - { name: hero_image, label: "HERO — Background cake photo", type: image, options: { media: site_images } }
      - { name: hero_image_alt, label: "HERO — Image description", type: string }
      - { name: about_image, label: "ABOUT — Cake photo", type: image, options: { media: site_images } }
      - { name: about_image_alt, label: "ABOUT — Image description", type: string }
      - { name: flavour_background, label: "FLAVOURS — Background photo", type: image, options: { media: site_images } }
      - { name: flavour_background_alt, label: "FLAVOURS — Image description", type: string }

  - name: services
    label: What I Make
    type: file
    path: content/services.json
    format: json
    list: true
    fields:
      - { name: title, label: Service title, type: string, required: true }
      - { name: description, label: Description, type: text }
      - { name: image, label: Hover photo, type: image, options: { media: site_images } }
      - { name: form_title, label: Matching order form name, type: string, description: "Must match a title in Order forms." }

  - name: gallery
    label: Portfolio
    type: file
    path: content/gallery.json
    format: json
    list: true
    fields:
      - { name: title, label: Cake title, type: string }
      - { name: category, label: Category, type: string }
      - { name: image, label: Photo, type: image, options: { media: site_images }, required: true }
      - { name: alt, label: Image description, type: string }

  - name: pricing
    label: Pricing & Sizes
    type: file
    path: content/pricing.json
    format: json
    list: true
    fields:
      - { name: size, label: Size, type: string }
      - { name: servings, label: Serves up to, type: string }
      - { name: price, label: Starting price, type: string }

  - name: flavour_menu
    label: Flavour Menu
    type: file
    path: content/flavour_menu.json
    format: json
    operations: { delete: false }
    fields:
      - { name: note, label: Bottom note, type: text }
      - name: groups
        label: Flavour groups
        type: object
        list: true
        fields:
          - { name: title, label: Group heading, type: string }
          - name: items
            label: Flavours
            type: object
            list: true
            fields:
              - { name: name, label: Flavour name, type: string }
              - { name: description, label: Description, type: text }

  - name: reviews
    label: Customer reviews
    type: file
    path: content/reviews.json
    format: json
    operations: { delete: false }
    fields:
      - { name: google_url, label: Google reviews URL, type: string }
      - name: items
        label: Reviews shown on website
        type: object
        list: true
        fields:
          - { name: author, label: Customer name, type: string }
          - { name: stars, label: Stars, type: number }
          - { name: text, label: Review text, type: text }

  - name: faq
    label: FAQ
    type: file
    path: content/faq.json
    format: json
    list: true
    fields:
      - { name: question, label: Question, type: string, required: true }
      - { name: answer, label: Answer, type: text, required: true }

  - name: policies
    label: Policies
    type: file
    path: content/policies.json
    format: json
    operations: { delete: false }
    fields:
      - name: sections
        label: Policy sections
        type: object
        list: true
        fields:
          - { name: title, label: Policy heading, type: string }
          - name: paragraphs
            label: Paragraphs
            type: string
            list: true

  - name: order_forms
    label: Order forms
    type: file
    path: content/order_forms.json
    format: json
    list: true
    fields:
      - { name: title, label: Product / form name, type: string, required: true }
      - { name: description, label: Short description, type: string }
      - { name: url, label: YouForm embed URL, type: string }
